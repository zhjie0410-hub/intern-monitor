name: 每日抓取实习岗位

on:
  schedule:
      # 目标：北京时间 11:00 前后跑完。
      # 实测 GitHub 免费版 cron 会排队：11-23 计划 11:00，实际 19:39，延迟 8.6 小时
      # 故提前 7 小时触发：UTC 20:00 = 北京次日 04:00，加延迟约落在 11:00 前后
      # 观察几天偏差大就改下面这行的数字
    - cron: "0 20 * * *"
  workflow_dispatch: {}        # 也能手动点一下就跑

# 让 job 有权限把结果 commit 回仓库
permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright pyyaml
          python -m playwright install --with-deps chromium

      - name: 抓取全部公司
        env:
          DSH_BROWSER_CHANNEL: ""      # 空 = 用 Playwright 自带 chromium（Linux 没有 msedge）
        run: |
          python run_all.py --pages 111

      - name: 生成看板到 docs/index.html
        run: |
          LATEST=$(ls -t data/exports/jobs-*.csv | head -1)
          echo "最新数据：$LATEST"
          mkdir -p data/latest
          cp "$LATEST" data/latest/jobs.csv
          python tools/build_dashboard.py --csv data/latest/jobs.csv --out docs/index.html

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest/jobs.csv docs/index.html
          if git diff --cached --quiet; then
            echo "数据没变化，不提交"
          else
            git commit -m "chore: 每日岗位更新 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi


